version: 2

updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      documentation-toolchain:
        patterns:
          - '*'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      repository-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
